<!doctype html>
<html lang="ar" dir="rtl"><head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0a0e15">
<meta name="description" content="لعبة كتابة بالعربي: اكسر القواعد قبل ما تنرقّع. اكتب بكلامك والكود هو الحكم.">
<meta property="og:type" content="website">
<meta property="og:title" content="Glitchrun: اكسر القواعد قبل ما تنرقّع">
<meta property="og:description" content="اكتب بكلامك، لاقي الثغرة، وشارك حيلتك. كل ثغرة بتنرقّع بالجولة الجاية.">
<meta property="og:image" content="https://waleedolabs.github.io/glitchrun/og.png">
<meta property="og:url" content="https://waleedolabs.github.io/glitchrun/">
<meta name="twitter:card" content="summary_large_image">
<title>Glitchrun</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans+Arabic:wght@400;500;600&family=Reem+Kufi:wght@500;600&display=swap">
<style>
/* Layout: one-screen run console. Header holds a level strip, three split-style readouts (moves, health or level meter, glitches) and today's banned words; the middle is a scrolling run log; the command bar sits at the bottom edge. */
:root {
  color-scheme: dark;
  --bg: #0a0e15;
  --surface: #111925;
  --surface2: #16202f;
  --ink: #e9eef6;
  --muted: #8a98ab;
  --line: #233044;
  --accent: #34e0cf;
  --accent-ink: #04201d;
  --glitch: #ff4f93;
  --gold: #ffc84a;
  --bad: #ff8a80;
  --font-display: "Reem Kufi", "IBM Plex Sans Arabic", system-ui, sans-serif;
  --font-body: "IBM Plex Sans Arabic", system-ui, -apple-system, "Segoe UI", Tahoma, sans-serif;
  --font-mono: "IBM Plex Mono", ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
}

html, body { height: 100%; }
body {
  margin: 0;
  background:
    radial-gradient(900px 520px at 85% -8%, rgba(255,79,147,.13), transparent 60%),
    radial-gradient(800px 520px at -5% 0%, rgba(52,224,207,.11), transparent 55%),
    var(--bg);
  background-attachment: fixed;
  color: var(--ink);
  font-family: var(--font-body);
  font-size: 16px;
  line-height: 1.6;
  direction: rtl;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
}
#app {
  display: flex;
  flex-direction: column;
  gap: 12px;
  height: 100%;
  box-sizing: border-box;
  max-width: 640px;
  margin: 0 auto;
  padding-block: 12px;
}
.k { font-size: 0.75rem; color: var(--muted); letter-spacing: 0.02em; }
.mono { font-family: var(--font-mono); }

header { display: flex; flex-direction: column; gap: 10px; }
.brand { display: flex; align-items: baseline; justify-content: space-between; gap: 12px; }
h1 { margin: 0; font-family: var(--font-display); font-weight: 600; font-size: 1.7rem; line-height: 1.2; direction: ltr; letter-spacing: .02em; text-shadow: 2px 0 var(--glitch), -2px 0 var(--accent); animation: gl 6s infinite; }
.meters { display: flex; align-items: center; gap: 6px; }
.pill { direction: ltr; font: inherit; font-size: 0.85rem; line-height: 1; color: var(--ink); background: var(--surface); border: 1px solid var(--line); border-radius: 999px; padding: 6px 11px; white-space: nowrap; }
.pill.gold { color: var(--gold); border-color: rgba(255,200,74,.45); }
button.pill { cursor: pointer; }
.pulse { animation: pop .5s ease; }
.bar { height: 5px; border-radius: 99px; background: var(--surface2); overflow: hidden; }
.bar i { display: block; height: 100%; width: 0; border-radius: 99px; background: linear-gradient(90deg, var(--accent), #7af0e4); transition: width .45s cubic-bezier(.2,.8,.2,1), background .3s; }
.bar i.warn { background: linear-gradient(90deg, var(--gold), #ffe39a); }
.bar i.danger { background: linear-gradient(90deg, var(--glitch), #ff9bc0); }
#gl .d { color: var(--line); letter-spacing: 2px; margin-inline-end: 6px; }
#gl .d.on { color: var(--glitch); text-shadow: 0 0 10px var(--glitch); }
.st { position: absolute; bottom: 1px; inset-inline: 0; font-size: 7px; line-height: 1; color: var(--gold); letter-spacing: 0; text-align: center; }
.stars { font-size: 2rem; color: var(--gold); letter-spacing: 6px; text-shadow: 0 0 18px rgba(255,200,74,.55); }
.stars .off { color: var(--line); text-shadow: none; }
.stars span { display: inline-block; animation: pop .55s cubic-bezier(.2,1.6,.4,1) both; }
.stars span:nth-child(2) { animation-delay: .15s; }
.stars span:nth-child(3) { animation-delay: .3s; }

/* fx */
#fx { position: fixed; inset: 0; pointer-events: none; z-index: 50; overflow: hidden; display: flex; flex-direction: column; align-items: center; padding-top: 108px; gap: 8px; }
.toast { background: rgba(17,25,37,.94); border: 1px solid var(--line); color: var(--ink); border-radius: 999px; padding: 8px 16px; font-weight: 600; box-shadow: 0 8px 30px rgba(0,0,0,.45); animation: toast 1.5s ease both; }
.toast.gold { color: var(--gold); border-color: rgba(255,200,74,.55); }
.toast.glitch { color: var(--glitch); border-color: rgba(255,79,147,.6); }
.pt { position: absolute; width: 8px; height: 8px; border-radius: 2px; animation: fly .9s cubic-bezier(.15,.7,.3,1) forwards; }
.flash { position: absolute; inset: 0; background: radial-gradient(circle at 50% 45%, rgba(255,79,147,.35), transparent 65%); animation: flash .6s ease both; }
@keyframes pop { 0% { transform: scale(.4); opacity: 0; } 70% { transform: scale(1.18); opacity: 1; } 100% { transform: scale(1); } }
@keyframes toast { 0% { transform: translateY(-14px) scale(.9); opacity: 0; } 12% { transform: none; opacity: 1; } 80% { opacity: 1; } 100% { transform: translateY(-8px); opacity: 0; } }
@keyframes fly { from { transform: translate(0,0) rotate(0); opacity: 1; } to { transform: translate(var(--dx), var(--dy)) rotate(280deg); opacity: 0; } }
@keyframes flash { from { opacity: 1; } to { opacity: 0; } }
@keyframes rise { from { transform: translateY(10px); opacity: 0; } to { transform: none; opacity: 1; } }
@keyframes shake { 0%,100% { transform: none; } 20% { transform: translateX(-6px); } 40% { transform: translateX(6px); } 60% { transform: translateX(-4px); } 80% { transform: translateX(3px); } }
@keyframes gl { 0%,92%,100% { transform: none; text-shadow: 2px 0 var(--glitch), -2px 0 var(--accent); } 94% { transform: translateX(-3px) skewX(-6deg); text-shadow: 5px 0 var(--glitch), -5px 0 var(--accent); } 96% { transform: translateX(3px); text-shadow: -4px 0 var(--glitch), 4px 0 var(--accent); } }
#app.shake { animation: shake .45s ease; }

#levels { display: flex; gap: 6px; overflow-x: auto; padding-block: 2px; }
.lvbtn { flex: 0 0 auto; width: 44px; height: 48px; padding-bottom: 8px; border-radius: 10px; border: 1px solid var(--line); background: var(--surface); color: var(--ink); font-family: var(--font-mono); font-size: 1rem; position: relative; }
.lvbtn[aria-pressed="true"] { background: var(--accent); border-color: var(--accent); color: var(--accent-ink); font-weight: 600; box-shadow: 0 0 18px rgba(52,224,207,.35); }


.stats { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; }
.stat { background: linear-gradient(180deg, var(--surface2), var(--surface)); border: 1px solid var(--line); border-radius: 12px; padding: 8px 12px; display: flex; flex-direction: column; gap: 2px; min-width: 0; }
.stat .v { font-family: var(--font-mono); font-size: 1.3rem; line-height: 1.3; font-variant-numeric: tabular-nums; }
.pips { display: flex; gap: 6px; padding-block: 8px; }
.pip { width: 14px; height: 14px; border-radius: 3px; border: 2px solid var(--bad); }
.pip.on { background: var(--bad); }

.banned { display: flex; flex-wrap: wrap; align-items: center; gap: 6px; }
.banned .w { font-size: 0.85rem; border: 1px dashed var(--glitch); color: var(--glitch); border-radius: 6px; padding: 0 8px; }

#log { flex: 1; min-height: 0; overflow-y: auto; display: flex; flex-direction: column; gap: 14px; padding-block: 4px; }
.intro { animation: rise .4s ease both; background: var(--surface); border: 1px solid var(--line); border-radius: 12px; padding: 12px 14px; display: flex; flex-direction: column; gap: 6px; }
.intro p { margin: 0; }
.intro h2 { margin: 0; font-family: var(--font-display); font-weight: 600; font-size: 1.15rem; }
.intro .em { color: var(--glitch); font-weight: 500; }

.turn { display: flex; flex-direction: column; gap: 4px; align-items: flex-start; animation: rise .35s ease both; }
.turn .chip { animation: pop .4s cubic-bezier(.2,1.5,.4,1) both; }
.cmd { font-family: var(--font-mono); font-size: 0.9rem; color: var(--muted); overflow-wrap: anywhere; }
.cmd::before { content: "\203A  "; color: var(--accent); }
.story { margin: 0; overflow-wrap: anywhere; }
.chip { font-size: 0.85rem; padding: 1px 10px; border-radius: 999px; border: 1px solid currentColor; }
.chip::before { content: ""; display: inline-block; width: 7px; height: 7px; border-radius: 50%; background: currentColor; margin-inline-end: 6px; }
.chip.ok { color: var(--accent); }
.chip.bad { color: var(--bad); }
.chip.glitch { color: var(--glitch); font-weight: 600; background: rgba(255,79,147,.1); box-shadow: 0 0 16px rgba(255,79,147,.35); }
.chip.info { color: var(--muted); }
.thinking { font-family: var(--font-mono); font-size: 0.85rem; color: var(--muted); }

#endCard { background: linear-gradient(180deg, var(--surface2), var(--surface)); border: 2px solid var(--accent); border-radius: 14px; padding: 14px; display: flex; flex-direction: column; gap: 8px; animation: rise .4s ease both; box-shadow: 0 0 30px rgba(52,224,207,.18); }
#endCard[hidden] { display: none; }
#endCard.lose { border-color: var(--bad); box-shadow: none; }
#endCard h2 { margin: 0; font-family: var(--font-display); font-weight: 600; font-size: 1.3rem; }
#endCard p { margin: 0; }
#endCard .found { color: var(--glitch); }
#chips { display: flex; flex-wrap: nowrap; gap: 6px; overflow-x: auto; padding-bottom: 2px; scrollbar-width: none; }
#chips::-webkit-scrollbar { display: none; }
#chips button { flex: 0 0 auto; }
#chips button { font: inherit; font-size: .85rem; padding: 5px 10px; border-radius: 999px; border: 1px solid var(--line); background: var(--surface); color: var(--ink); cursor: pointer; }
#chips button:hover { border-color: var(--accent); }
.chal { background: var(--surface); border: 1px dashed var(--glitch); border-radius: 12px; padding: 10px 12px; }
.row { display: flex; flex-wrap: wrap; gap: 8px; }

footer { display: flex; flex-direction: column; gap: 8px; }
form { display: flex; gap: 8px; }
input[type="text"] { flex: 1; min-width: 0; height: 48px; font: inherit; font-size: 16px; color: var(--ink); background: var(--surface); border: 1px solid var(--line); border-radius: 10px; padding: 0 14px; }
input[type="text"]::placeholder { color: var(--muted); }
button { font: inherit; cursor: pointer; }
#send { height: 48px; padding: 0 22px; border: 0; border-radius: 10px; background: linear-gradient(135deg, var(--accent), #7af0e4); color: var(--accent-ink); font-weight: 700; box-shadow: 0 4px 18px rgba(52,224,207,.3); }
#send:active { transform: scale(.97); }
#send:disabled, input:disabled { opacity: 0.5; cursor: not-allowed; }
.btn-line { border: 1px solid var(--accent); background: transparent; color: var(--accent); border-radius: 10px; padding: 8px 16px; font-weight: 500; }
.btn-fill { border: 0; background: linear-gradient(135deg, var(--accent), #7af0e4); color: var(--accent-ink); border-radius: 10px; padding: 8px 16px; font-weight: 700; }
.btn-wa { border: 0; background: #25d366; color: #052e16; border-radius: 10px; padding: 8px 16px; font-weight: 700; }
.btn-glitch { border: 0; background: linear-gradient(135deg, var(--glitch), #ff8ab5); color: #2a0414; border-radius: 10px; padding: 8px 16px; font-weight: 700; }
.tools { display: flex; align-items: center; justify-content: space-between; gap: 12px; }
.linkbtn { background: none; border: 0; color: var(--gold); padding: 4px 0; font-size: 0.9rem; }
#narr { font-family: var(--font-mono); font-size: 0.75rem; color: var(--muted); direction: rtl; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
@media (prefers-reduced-motion: reduce) { * { scroll-behavior: auto !important; animation: none !important; transition: none !important; } }
</style>
</head><body>


<div id="fx" aria-hidden="true"></div>
<div id="app" dir="rtl" lang="ar">
  <header>
    <div class="brand">
      <h1>Glitchrun</h1>
      <div class="meters">
        <span id="streak" class="pill" title="أيام متتالية">🔥 0</span>
        <span id="lights" class="pill gold" title="أضواء: كل ثغرة بتعطيك ضوء، والضوء بيفتح تلميح">💡 1</span>
        <button id="snd" class="pill" type="button" aria-label="الصوت">🔊</button>
      </div>
    </div>
    <nav id="levels" aria-label="المراحل"></nav>
    <div class="stats">
      <div class="stat"><span class="k">الحركات</span><span class="v" id="moves">0/10</span></div>
      <div class="stat"><span class="k" id="k2">الصحة</span><span id="hp"></span></div>
      <div class="stat"><span class="k">الثغرات</span><span class="v" id="gl">0/3</span></div>
    </div>
    <div class="bar" aria-hidden="true"><i id="movebar"></i></div>
    <div class="banned"><span class="k">ممنوع اليوم</span><span id="bannedList" style="display:contents"></span></div>
  </header>

  <main id="log" aria-live="polite"></main>

  <footer>
    <div id="endCard" hidden></div>
    <div id="chips" aria-label="أمثلة"></div>
    <form id="f" autocomplete="off">
      <input id="cmd" type="text" dir="auto" autocomplete="off" autocapitalize="off" spellcheck="false" enterkeyhint="send" placeholder="اكتب أمرك بكلامك...">
      <button id="send" type="submit">نفّذ</button>
    </form>
    <div class="tools">
      <button id="hint" class="linkbtn" type="button">💡 تلميح</button>
      <span id="hearts" aria-label="القلوب"></span>
      <span id="narr">السارد: جاري التحقق</span>
    </div>
  </footer>
</div>

<script>
"use strict";
//ENGINE-START
function R(k, t) { return { kind: k, text: t }; }
var TAKE = /خذ|خد|امسك|التقط|جيب|take|grab|get|pick/;

var LEVELS = [
  /* 1: الغرفة المقفلة */
  {
    id: "room", title: "الغرفة المقفلة", goal: "اطلع برا بأقل عدد حركات.", max: 10,
    world: "a small room with a locked door (needs a key), a key on the table, a sleeping guard next to the door, one stone wall, and the player.",
    intro: ["أنت بغرفة مقفلة. على الطاولة مفتاح، وجنب الباب حارس نايم."],
    hints: ["الطريق العادي: مفتاح، باب، طلوع. بس فتح الباب بيعمل صوت.", "مو كل حيط حيط... جرّب تحكي معو.", "لو كنت مكان الحارس، مين بيفتح الباب؟", "في طريقة أخيرة بتاخد حركات كتير: الهروب بالنوم."],
    actions: [["take_key", "pick up the key."], ["open_door", "unlock or open the door."], ["exit", "walk out through the open door."], ["sneak", "move quietly so the guard stays asleep."], ["attack", "fight or hit the guard."], ["look", "look around or inspect."]],
    glitches: {
      glitch_wall:  { name: "حيلة الحيط",   cost: 1, line: "الحيط صار باب ومشيت منه.", desc: "the player treats the wall as a door, or tries to walk, dig, phase or climb through the wall." },
      glitch_guard: { name: "حيلة الحارس", cost: 2, line: "الحارس صدّق إنك الحارس، فتح لك وطلعت.", desc: "the player claims to be the guard, swaps places with him, or tricks him into opening the door or leaving." },
      glitch_dream: { name: "حيلة الحلم",   cost: 4, line: "نمت وصحيت برا الغرفة.", desc: "the player goes to sleep or dreams in order to get outside." }
    },
    story: {
      take_key: "مدّيت إيدك عالطاولة ولقطت المفتاح البارد.", open_door: "حطيت المفتاح بالقفل وحاولت تلفّه.", exit: "خطيت خطوتك الكبيرة باتجاه الباب.",
      sneak: "مشيت على أطراف أصابعك متل القطة.", attack: "رفعت إيدك وهجمت على الحارس.", look: "دورت بعيونك عالغرفة.",
      glitch_wall: "وقفت قدام الحيط وحكيت له بكل ثقة إنه باب.", glitch_guard: "قربت من الحارس وهمست له إنك إنت الحارس هون.", glitch_dream: "غمضت عيونك وسلّمت حالك للنوم.",
      none: "حكيت شي غريب، والغرفة هزّت كتافها."
    },
    init: function (s) { s.hasKey = false; s.doorOpen = false; s.guard = "asleep"; s.quiet = false; },
    ai: function (s) { return { has_key: s.hasKey, door_open: s.doorOpen, guard: s.guard }; },
    local: function (n) {
      function has(re) { return re.test(n); }
      var wall = /حيط|جدار|wall/, door = /باب|door/, key = /مفتاح|key/;
      if (has(/انا (ال)?حارس|صرت (ال)?حارس|i am the guard|become the guard|swap.*guard|بدل.*حارس/)) return "glitch_guard";
      if (wall.test(n) && (door.test(n) || has(/امشي|مشي|اعبر|عبر|اخترق|اطلع|walk|through|become|صار|حول/))) return "glitch_wall";
      if (has(/انام|ننام|نمت|احلم|حلم|dream|sleep|asleep/)) return "glitch_dream";
      if (key.test(n) && TAKE.test(n)) return "take_key";
      if (door.test(n) && has(/افتح|فتح|فك|open|unlock/)) return "open_door";
      if (has(/اخرج|اطلع|طلع|برا|هرب|exit|leave|go out|escape/)) return "exit";
      if (has(/تسلل|بهدوء|هدي|اهدا|sneak|quiet|silent/)) return "sneak";
      if (has(/اضرب|ضرب|هاجم|اقتل|attack|hit|fight/)) return "attack";
      if (has(/شوف|انظر|look|inspect|وين/)) return "look";
      return "none";
    },
    step: function (s, a) {
      switch (a) {
        case "take_key":
          if (s.hasKey) return R("bad", "المفتاح معك أصلاً. حركة ضايعة.");
          s.hasKey = true; return R("ok", "صار المفتاح معك.");
        case "open_door":
          if (!s.hasKey) return R("bad", "الباب مقفل. بدك مفتاح.");
          if (s.doorOpen) return R("bad", "الباب مفتوح أصلاً.");
          s.doorOpen = true;
          if (!s.quiet && s.guard === "asleep") { s.guard = "awake"; return R("bad", "انفتح الباب، بس الصوت صحّى الحارس."); }
          return R("ok", "انفتح الباب بهدوء، والحارس لسا نايم.");
        case "sneak":
          if (s.guard === "awake") return R("bad", "الحارس صاحي. التسلل ما عاد بيفيد.");
          s.quiet = true; return R("ok", "صرت تمشي بهدوء. الحارس ما رح يصحى من صوت الباب.");
        case "attack":
          s.hp -= 1; s.guard = "awake"; return R("bad", "الحارس صحي وضربك. خسرت قلب.");
        case "exit":
          if (!s.doorOpen) return R("bad", "الباب مغلق. ما فيك تطلع.");
          if (s.guard === "awake") { s.hp -= 1; s.moves += 2; s.out = true; return R("bad", "طلعت، بس الحارس خدشك. خسرت قلب وحركتين."); }
          s.out = true; return R("ok", "طلعت من الغرفة بهدوء.");
        case "look":
          return R("info", "غرفة، باب " + (s.doorOpen ? "مفتوح" : "مقفل") + "، " + (s.hasKey ? "المفتاح معك" : "مفتاح على الطاولة") + "، حارس " + (s.guard === "asleep" ? "نايم" : "صاحي") + ".");
      }
      return R("info", "ما صار شي بالعالم.");
    }
  },

  /* 2: السوق */
  {
    id: "market", title: "السوق", goal: "طلّع تفاحة من السوق، بشرف أو بدونه.", max: 8,
    world: "a busy market stall run by a vendor named Abu Fadi who watches his apples, one red apple on the stall, a sleepy cat under the stall, a loud customer shouting far away, and the player holding 2 coins. The apple costs 3 coins; each haggle lowers the price by 1 (minimum 1). Helping the vendor twice earns the apple as thanks.",
    intro: ["أنت بالسوق وجوعان. على البسطة تفاحة حمرا، والبياع أبو فادي عينه عليها. تحت البسطة قطة نايمة، وبآخر السوق زبون عم يصرخ. معك عملتين، والتفاحة بـ3. جرّب أي فكرة منطقية بتخطر ببالك."],
    hints: ["في 3 طرق عادية بتخلص بـ3 حركات: دفع، سرقة، أو شغل عند البياع.", "البياع بيحب الكلام والمساعدة. والقطة والزبون ممكن يلهّوه عن التفاحة.", "مين ممكن البياع يخاف منه؟ أو شو ممكن يقبل بدل المصاري؟"],
