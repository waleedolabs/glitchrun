<style>
/* GLITCHRUN v10 — dark "signal" console. A cold graphite room, one amber signal colour for the patch tape,
   a magenta fault colour for glitches. Sharp corners, thin lines, quiet type; the glitch tear is the only loud moment. */
:root {
  --bg: #0D0F17;
  --bg-2: #12151F;
  --panel: #161A26;
  --panel-2: #1D2231;
  --ink: #E7E5EE;
  --muted: #8B8FA3;
  --line: rgba(231,229,238,.09);
  --line-2: rgba(231,229,238,.18);
  --amber: #F2B544;
  --amber-ink: #1A1200;
  --hot: #FF3D6E;
  --mint: #3DD6A0;
  --bad: #FF5A5F;
  --cyan: #5CC8FF;
  --logo: "Archivo", "Readex Pro", system-ui, sans-serif;
  --body: "Readex Pro", system-ui, sans-serif;
  color-scheme: dark;
}
* { box-sizing: border-box; }
html, body { margin: 0; height: 100%; }
body {
  background: var(--bg);
  background-image: linear-gradient(var(--line) 1px, transparent 1px), linear-gradient(90deg, var(--line) 1px, transparent 1px);
  background-size: 44px 44px; background-position: -1px -1px;
  color: var(--ink); font-family: var(--body); font-size: 16px; line-height: 1.65;
  -webkit-tap-highlight-color: transparent;
}
body::before { content: ""; position: fixed; inset: 0; pointer-events: none; background: radial-gradient(ellipse at 50% -10%, rgba(92,200,255,.10), transparent 55%), radial-gradient(ellipse at 50% 120%, rgba(255,61,110,.08), transparent 50%); }
button, input { font: inherit; color: inherit; }
button { cursor: pointer; }
:focus-visible { outline: 2px solid var(--amber); outline-offset: 2px; }

#app {
  max-width: 560px; margin: 0 auto; height: 100dvh; display: flex; flex-direction: column;
  padding: max(12px, env(safe-area-inset-top)) 16px max(10px, env(safe-area-inset-bottom));
  gap: 12px; position: relative;
}

/* ---------- top bar ---------- */
.top { display: flex; align-items: center; justify-content: space-between; gap: 10px; }
.logo {
  margin: 0; font-family: var(--logo); font-weight: 800; font-stretch: 125%; font-size: 1.45rem; line-height: 1;
  letter-spacing: .04em; direction: ltr; color: var(--ink);
  text-shadow: -1.5px 0 rgba(255,61,110,.75), 1.5px 0 rgba(92,200,255,.75);
}
.meters { display: flex; gap: 6px; }
.pill { display: inline-flex; align-items: center; gap: 5px; height: 32px; padding: 0 10px; border-radius: 8px; border: 1px solid var(--line-2); background: var(--panel); color: var(--ink); font-weight: 500; font-size: .88rem; font-variant-numeric: tabular-nums; }
.pill.gold { border-color: rgba(242,181,68,.45); color: var(--amber); }
.pulse { animation: pop .5s ease; }
@keyframes pop { 40% { transform: scale(1.15); } }

/* ---------- level route ---------- */
#levels { display: flex; align-items: center; overflow-x: auto; scrollbar-width: none; padding: 4px 2px 14px; }
#levels::-webkit-scrollbar { display: none; }
.lvbtn {
  flex: 0 0 auto; position: relative; width: 34px; height: 34px; border-radius: 8px;
  border: 1px solid var(--line-2); background: var(--panel); color: var(--muted); font-weight: 600; font-size: .9rem;
  display: grid; place-items: center; padding: 0; margin-inline-end: 16px; transition: border-color .15s, color .15s;
  font-variant-numeric: tabular-nums;
}
.lvbtn:not(.daily)::after { content: ""; position: absolute; inset-inline-start: 100%; width: 16px; height: 1px; background: var(--line-2); top: 50%; }
.lvbtn:last-child { margin-inline-end: 0; }
.lvbtn:last-child::after { display: none; }
.lvbtn.done { color: var(--ink); border-color: rgba(61,214,160,.5); }
.lvbtn[aria-pressed="true"] { background: var(--ink); color: var(--bg); border-color: var(--ink); }
.lvbtn.locked { border-style: dashed; color: var(--muted); font-size: .7rem; opacity: .6; }
.lvbtn .st { position: absolute; top: 100%; margin-top: 2px; font-size: .55rem; color: var(--amber); letter-spacing: -1px; white-space: nowrap; }
.lvbtn.daily { width: auto; padding: 0 12px; color: var(--amber); border-color: rgba(242,181,68,.5); margin-inline-end: 14px; font-size: .85rem; }
.lvbtn.daily[aria-pressed="true"] { background: var(--amber); color: var(--amber-ink); border-color: var(--amber); }
.lvbtn.daily.new::before { content: ""; position: absolute; top: -3px; inset-inline-end: -3px; width: 8px; height: 8px; border-radius: 50%; background: var(--hot); }

/* ---------- HUD ---------- */
.hud { display: grid; gap: 7px; }
.cells { display: flex; gap: 3px; direction: rtl; }
.cell { flex: 1; height: 6px; border-radius: 1px; background: var(--panel-2); transition: background .25s; }
.cell.ok { background: var(--mint); } .cell.bad { background: var(--bad); } .cell.glitch { background: var(--hot); box-shadow: 0 0 10px rgba(255,61,110,.6); }
.cell.info { background: var(--muted); } .cell.ban { background: #000; outline: 1px solid var(--bad); } .cell.spent { background: var(--line-2); }
.cell.new { animation: drop .35s ease; }
@keyframes drop { 0% { transform: scaleY(2.4); } }
.cells.warn .cell:not(.ok):not(.bad):not(.glitch):not(.info):not(.ban):not(.spent) { background: rgba(242,181,68,.25); }
.hudrow { display: flex; justify-content: space-between; align-items: center; font-size: .82rem; gap: 10px; color: var(--muted); }
.hudrow b { color: var(--ink); font-weight: 600; font-size: 1.05rem; font-variant-numeric: tabular-nums; }
#hp { display: inline-flex; gap: 3px; align-items: center; }
#hp .h { width: 14px; height: 6px; border-radius: 1px; background: var(--bad); } #hp .h.off { background: var(--panel-2); }
#gl { display: inline-flex; gap: 4px; align-items: center; }
#gl .d { color: var(--panel-2); font-size: .8rem; } #gl .d.on { color: var(--hot); text-shadow: 0 0 8px rgba(255,61,110,.7); }

/* ---------- the log ---------- */
#log {
  flex: 1; min-height: 0; overflow-y: auto; background: var(--panel); border: 1px solid var(--line);
  border-radius: 12px; padding: 20px 18px 24px; scroll-behavior: smooth; position: relative;
}
.intro h2 { font-weight: 700; font-size: 1.75rem; line-height: 1.2; margin: 0 0 8px; letter-spacing: -.01em; }
.intro .scene { margin: 0 0 14px; color: #C9C7D4; }
.goal { display: inline-block; border-inline-start: 3px solid var(--amber); padding: 2px 12px; color: var(--ink); font-weight: 500; margin: 0 0 14px; background: rgba(242,181,68,.07); }
.dailytag { color: var(--amber); font-weight: 500; margin: 0 0 6px; font-size: .88rem; }
.rules { color: var(--muted); font-size: .88rem; }
.rules summary { cursor: pointer; color: var(--ink); width: max-content; }
.rules p { margin: 6px 0; }
.chal { border: 1px solid rgba(242,181,68,.4); color: var(--ink); border-radius: 8px; padding: 10px 14px; margin-bottom: 16px; font-size: .92rem; background: rgba(242,181,68,.06); }

.turn { margin-top: 20px; animation: rise .25s ease; }
@keyframes rise { from { opacity: 0; transform: translateY(6px); } }
.turn .cmd { display: inline-block; max-width: 90%; color: var(--cyan); font-weight: 500; margin-bottom: 4px; unicode-bidi: plaintext; }
.turn .cmd::before { content: "› "; color: var(--muted); }
.story { margin: 0 0 8px; font-size: 1.02rem; unicode-bidi: plaintext; }
.chips-out { display: flex; flex-wrap: wrap; gap: 6px; }
.chip { display: inline-block; padding: 2px 10px; border-radius: 4px; font-size: .86rem; font-weight: 500; unicode-bidi: plaintext; border: 1px solid transparent; animation: stamp .28s ease both; }
.chip:nth-child(2) { animation-delay: .08s; } .chip:nth-child(3) { animation-delay: .16s; } .chip:nth-child(4) { animation-delay: .24s; }
@keyframes stamp { 0% { opacity: 0; transform: translateX(-6px); } }
.chip.ok { color: var(--mint); border-color: rgba(61,214,160,.3); }
.chip.bad { color: var(--bad); border-color: rgba(255,90,95,.3); }
.chip.info { color: var(--muted); border-color: var(--line-2); }
.chip.glitch { background: var(--hot); color: #fff; }
.thinking { margin-top: 20px; color: var(--muted); display: flex; gap: 5px; align-items: center; font-size: .9rem; }
.thinking i { width: 5px; height: 5px; background: var(--cyan); animation: blink 1s infinite; }
.thinking i:nth-child(2) { animation-delay: .15s; } .thinking i:nth-child(3) { animation-delay: .3s; }
@keyframes blink { 50% { opacity: .15; } }

/* ---------- dock ---------- */
.dock { display: grid; gap: 8px; }
#chips { display: flex; gap: 6px; flex-wrap: wrap; }
#chips[hidden] { display: none; }
#chips button { border: 1px solid var(--line-2); background: transparent; color: var(--muted); padding: 5px 12px; border-radius: 6px; font-size: .86rem; }
#f { display: flex; gap: 6px; background: var(--panel); border: 1px solid var(--line-2); padding: 5px; border-radius: 10px; }
#cmd { flex: 1; min-width: 0; border: 0; background: transparent; padding: 10px 10px; font-size: 1.02rem; outline: none; }
#cmd::placeholder { color: var(--muted); }
#f:focus-within { border-color: var(--cyan); box-shadow: 0 0 0 3px rgba(92,200,255,.12); }
#send { border: 0; background: var(--ink); color: var(--bg); font-weight: 700; padding: 0 20px; border-radius: 7px; }
#send:disabled { opacity: .35; }
#send:active { transform: scale(.97); }
.dockrow { display: flex; align-items: center; justify-content: space-between; gap: 8px; color: var(--muted); font-size: .8rem; flex-wrap: wrap; }
#hint { border: 0; background: transparent; color: var(--amber); font-weight: 500; padding: 4px 0; }
.banned { order: 3; flex: 1 1 100%; display: flex; gap: 6px; align-items: center; flex-wrap: wrap; }
.banned .w { text-decoration: line-through; text-decoration-color: var(--hot); text-decoration-thickness: 1.5px; color: var(--ink); }
#narr { display: inline-flex; align-items: center; gap: 6px; }
#narr::before { content: ""; width: 6px; height: 6px; border-radius: 50%; background: var(--mint); box-shadow: 0 0 8px var(--mint); }
#narr.off::before { background: var(--amber); box-shadow: none; }
#hearts { display: none; }

/* ---------- end sheet ---------- */
#scrim { position: fixed; inset: 0; background: rgba(5,6,10,.7); backdrop-filter: blur(3px); z-index: 20; animation: fade .2s ease; }
#scrim[hidden] { display: none; }
@keyframes fade { from { opacity: 0; } }
#endCard {
  position: fixed; inset-inline: 0; bottom: 0; z-index: 21; margin: 0 auto; max-width: 560px;
  background: var(--bg-2); border: 1px solid var(--line-2); border-bottom: 0; border-radius: 16px 16px 0 0;
  padding: 24px 20px max(20px, env(safe-area-inset-bottom)); animation: up .35s cubic-bezier(.2,.9,.3,1); max-height: 88dvh; overflow-y: auto;
}
#endCard[hidden] { display: none; }
@keyframes up { from { transform: translateY(100%); } }
#endCard h2 { font-weight: 700; font-size: 1.9rem; line-height: 1.2; margin: 0; }
#endCard.lose h2 { color: var(--bad); }
#endCard p { margin: 6px 0; unicode-bidi: plaintext; }
.stars { display: flex; gap: 8px; font-size: 2rem; line-height: 1.1; margin: 10px 0 6px; }
.stars span { color: var(--amber); text-shadow: 0 0 14px rgba(242,181,68,.45); animation: lit .4s ease both; }
.stars span:nth-child(2) { animation-delay: .2s; } .stars span:nth-child(3) { animation-delay: .4s; }
.stars span.off { color: var(--panel-2); text-shadow: none; }
@keyframes lit { 0% { opacity: 0; transform: scale(1.6); } }
.endgrid { display: flex; gap: 3px; margin: 10px 0; }
.endgrid i { width: 16px; height: 16px; border-radius: 2px; background: var(--panel-2); }
.endgrid i.ok { background: var(--mint); } .endgrid i.bad { background: var(--bad); } .endgrid i.glitch { background: var(--hot); } .endgrid i.ban { background: #000; outline: 1px solid var(--bad); }
.miss { color: var(--muted); font-size: .9rem; }
.found { color: var(--hot); }
.reveal { border-inline-start: 3px solid var(--amber); padding: 4px 12px; background: rgba(242,181,68,.07); }
.row { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 16px; }
.row button { border: 1px solid var(--line-2); border-radius: 8px; padding: 12px 16px; font-weight: 600; font-size: .95rem; flex: 1 1 auto; background: transparent; }
.btn-fill { background: var(--ink) !important; color: var(--bg); border-color: var(--ink) !important; }
.btn-glitch { background: var(--hot) !important; color: #fff; border-color: var(--hot) !important; }
.btn-wa { color: #4ADE80; border-color: rgba(74,222,128,.4) !important; }
.btn-line { color: var(--ink); }

/* ---------- fx ---------- */
#fx { position: fixed; inset: 0; pointer-events: none; z-index: 30; overflow: hidden; }
.toast { position: absolute; bottom: 150px; left: 50%; transform: translateX(-50%); background: var(--panel-2); border: 1px solid var(--line-2); color: var(--ink); padding: 8px 16px; border-radius: 8px; font-weight: 500; white-space: nowrap; animation: tin 1.5s ease both; font-size: .9rem; }
.toast.gold { color: var(--amber); border-color: rgba(242,181,68,.45); }
.toast.glitch { background: var(--hot); color: #fff; border-color: var(--hot); }
@keyframes tin { 0% { opacity: 0; transform: translate(-50%, 10px); } 12%, 80% { opacity: 1; transform: translate(-50%, 0); } 100% { opacity: 0; } }
.pt { position: absolute; width: 2px; height: 16px; animation: fly .9s cubic-bezier(.15,.6,.3,1) forwards; }
@keyframes fly { to { transform: translate(var(--dx), var(--dy)) rotate(300deg); opacity: 0; } }
#log.tear { animation: tear .55s steps(6) 1; }
@keyframes tear {
  0% { clip-path: inset(0); transform: none; filter: none; }
  20% { clip-path: polygon(0 0,100% 0,100% 30%,94% 30%,94% 44%,100% 44%,100% 100%,0 100%,0 60%,7% 60%,7% 48%,0 48%); transform: translateX(-8px); filter: hue-rotate(90deg) saturate(2.5); }
  45% { transform: translateX(10px) skewX(-3deg); filter: hue-rotate(-60deg) contrast(1.4); }
  70% { transform: translateX(-4px); filter: invert(.12); }
  100% { clip-path: inset(0); transform: none; filter: none; }
}
.patchtape {
  position: absolute; left: -4%; right: -4%; top: 40%; z-index: 31; text-align: center; direction: rtl;
  background: var(--amber); color: var(--amber-ink); font-weight: 700; font-size: 1.35rem; line-height: 1; padding: 14px 0;
  box-shadow: 0 10px 40px rgba(0,0,0,.6); animation: slap 1.6s cubic-bezier(.2,1.3,.4,1) both;
  background-image: repeating-linear-gradient(90deg, rgba(0,0,0,.06) 0 1px, transparent 1px 7px);
}
.patchtape small { display: block; font-family: var(--logo); font-weight: 800; font-stretch: 125%; font-size: .62rem; letter-spacing: .25em; margin-bottom: 6px; direction: ltr; }
@keyframes slap { 0% { transform: rotate(-14deg) scale(1.4); opacity: 0; } 16% { transform: rotate(-3deg) scale(1); opacity: 1; } 82% { opacity: 1; transform: rotate(-3deg); } 100% { opacity: 0; transform: rotate(-3deg) translateY(-16px); } }
.flashwin { position: absolute; inset: 0; background: radial-gradient(circle at 50% 70%, rgba(242,181,68,.35), transparent 60%); animation: fw .7s ease forwards; }
@keyframes fw { to { opacity: 0; } }
#app.shake { animation: shk .35s; }
@keyframes shk { 25% { transform: translateX(-4px); } 50% { transform: translateX(4px); } 75% { transform: translateX(-2px); } }

@media (min-width: 600px) { #app { padding-top: 24px; padding-bottom: 22px; } .logo { font-size: 1.7rem; } }
@media (prefers-reduced-motion: reduce) { *, *::before, *::after { animation: none !important; transition: none !important; } }
</style>

<div id="app" dir="rtl" lang="ar">
  <header class="top">
    <h1 class="logo">GLITCHRUN</h1>
    <div class="meters">
      <span id="streak" class="pill" title="أيام لعب ورا بعض">🔥 0</span>
      <span id="lights" class="pill gold" title="لمبات: بتكسبها لما تلاقي ثغرة، وكل لمبة بتفتح تلميح">💡 0</span>
      <button id="lang" class="pill" type="button" aria-label="Language">EN</button>
      <button id="snd" class="pill" type="button" aria-label="الصوت">🔊</button>
    </div>
  </header>
  <nav id="levels" aria-label="المراحل"></nav>
  <section class="hud" aria-label="حالة الجولة">
    <div id="cells" class="cells" aria-hidden="true"></div>
    <div class="hudrow">
      <span>حركات <b id="moves">0/10</b></span>
      <span id="hpwrap"><span id="k2" class="sr"></span> <span id="hp"></span></span>
      <span id="gl" title="الثغرات اللي لقيتها بهالمرحلة"></span>
    </div>
  </section>
  <main id="log" aria-live="polite"></main>
  <footer class="dock">
    <div id="chips" aria-label="أمثلة"></div>
    <form id="f" autocomplete="off">
      <input id="cmd" type="text" dir="auto" autocomplete="off" autocapitalize="off" spellcheck="false" enterkeyhint="send" maxlength="140" placeholder="شو بدك تعمل؟ اكتبها بكلامك" aria-label="أمرك">
      <button id="send" type="button">نفّذ</button>
    </form>
    <div class="dockrow">
      <button id="hint" type="button">💡 تلميح</button>
      <span class="banned" aria-label="كلمات ممنوعة اليوم">ممنوع اليوم: <span id="bannedList" style="display:contents"></span></span>
      <span id="narr">السارد جاهز</span>
      <span id="hearts"></span>
    </div>
  </footer>
</div>
<div id="scrim" hidden></div>
<div id="endCard" hidden role="dialog" aria-label="نتيجة الجولة"></div>
<div id="fx" aria-hidden="true"></div>

<script>
"use strict";
//ENGINE-START
var LANG = (function () {
  try {
    var q = (location.search.match(/[?&]lang=(en|ar)/) || [])[1];
    if (q) { try { localStorage.setItem("glitchrun_lang", q); } catch (e) {} return q; }
    var v = localStorage.getItem("glitchrun_lang"); if (v === "en" || v === "ar") return v;
  } catch (e) {}
  return "ar";
})();

    local: function (n) {
      function has(re) { return re.test(n); }
      var wall = /حيط|جدار|wall/, door = /باب|door/, key = /مفتاح|key/;
      if (has(/انا (ال)?حارس|صرت (ال)?حارس|i am the guard|become the guard|swap.*guard|بدل.*حارس/)) return "glitch_guard";
      if (wall.test(n) && (door.test(n) || has(/امشي|مشي|اعبر|عبر|اخترق|اطلع|walk|through|become|صار|حول/))) return "glitch_wall";
      if (has(/انام|ننام|نمت|احلم|حلم|dream|sleep|asleep/)) return "glitch_dream";
      if (key.test(n) && TAKE.test(n)) return "take_key";
      if (door.test(n) && has(/افتح|فتح|فك|open|unlock/)) return "open_door";
      if (has(/اخرج|اطلع|طلع|برا|هرب|exit|leave|go out|walk out|get out|run away|go outside|escape/)) return "exit";

    step: function (s, a) {

          if (s.hasKey) return R("bad", T("المفتاح معك أصلاً. حركة ضايعة."));
          s.hasKey = true; return R("ok", T("صار المفتاح معك."));
        case "open_door":
          if (!s.hasKey) return R("bad", T("الباب مقفل. بدك مفتاح."));
          if (s.doorOpen) return R("bad", T("الباب مفتوح أصلاً."));
          s.doorOpen = true;
          if (!s.quiet && s.guard === "asleep") { s.guard = "awake"; return R("bad", T("انفتح الباب، بس الصوت صحّى الحارس.")); }
          return R("ok", T("انفتح الباب بهدوء، والحارس لسا نايم."));
        case "sneak":
          if (s.guard === "awake") return R("bad", T("الحارس صاحي. التسلل ما عاد بيفيد."));
          s.quiet = true; return R("ok", T("صرت تمشي بهدوء. الحارس ما رح يصحى من صوت الباب."));
        case "attack":
          s.hp -= 1; s.guard = "awake"; return R("bad", T("الحارس صحي وعطاك كف محترم. راح قلب 💔"));
        case "exit":
          if (!s.doorOpen) return R("bad", T("الباب مغلق. ما فيك تطلع."));
          if (s.guard === "awake") { s.hp -= 1; s.moves += 2; s.out = true; return R("bad", T("طلعت، بس الحارس خدشك. خسرت قلب وحركتين.")); }
          s.out = true; return R("ok", T("طلعت من الغرفة بهدوء."));
        case "look":
          return R("info", T("غرفة، باب ") + (s.doorOpen ? T("مفتوح") : T("مقفل")) + T("، ") + (s.hasKey ? T("المفتاح معك") : T("مفتاح على الطاولة")) + T("، حارس ") + (s.guard === "asleep" ? T("نايم") : T("صاحي")) + ".");
      }
      return R("bad", noneLine(s));
    }

  /* ---------- end sheet ---------- */
  var LOSE = [T("ولا يهمك، حتى أبو رضا الخباز بيخسر أحياناً."), T("قربت! جرّب فكرة أجنّ."), T("العالم انتصر هالمرة… بس مش للأبد."), T("خسارة بكرامة. يلا مرة تانية؟")];
  function closeEnd() { endCard.hidden = true; scrim.hidden = true; }
  function showEnd() {
    var lv = LEVELS[li];
    endCard.textContent = ""; endCard.className = S.won ? "" : "lose";
    if (S.won) {
      var nextLocked = li < LEVELS.length - 1 && !unlocked(li + 1);
      S.stars = runStars(); saveStars(lv.id, S.stars);
      endCard.appendChild(el("h2", "", daily ? T("خلّصت تحدي اليوم #") + DAILY_N : T("نجحت")));
      var sd = el("div", "stars"); sd.setAttribute("aria-label", S.stars + T(" من 3 نجوم"));
      for (var si = 0; si < 3; si++) sd.appendChild(el("span", si < S.stars ? "" : "off", "★"));
      endCard.appendChild(sd);
      var line = T("خلّصتها بـ ") + S.moves + T(" حركة."), b = loadBest(lv.id);
      if (b === null || S.moves < b) { saveBest(lv.id, S.moves); line += T(" هاد أفضل رقم إلك."); } else line += T(" أفضل رقم إلك: ") + b + ".";
      endCard.appendChild(el("p", "", line));
      if (hintN > 0) endCard.appendChild(el("p", "miss", T("☆ نجمة: خلّصها بدون تلميح.")));
      var tot = Object.keys(lv.glitches).length, got = patchedCount(li, S.patched);
      if (got < tot) endCard.appendChild(el("p", "miss", T("☆ نجمة: لاقي كل ثغرات المرحلة (") + got + "/" + tot + ")."));
      if (!reduceMotion) { var fw = el("div", "flashwin"); fx.appendChild(fw); setTimeout(function () { fw.remove(); }, 520); }
      burst(S.stars * 12, ["#F2B544", "#3DD6A0", "#5CC8FF"], 70); beep(SND.win); buzz([40, 30, 40, 30, 90]);
      if (nextLocked) toast(T("🔓 انفتحت المرحلة ") + (li + 2), "");
      ev("win");
    } else {
      endCard.appendChild(el("h2", "", T("خسرت")));
      endCard.appendChild(el("p", "", S.reason + " " + LOSE[(S.moves + li) % LOSE.length]));
      beep(SND.bad); ev("lose");
    }
    var eg = el("div", "endgrid");
    (S.grid || []).slice(0, 20).forEach(function (g) { eg.appendChild(el("i", GCLS[g] || "info")); });
    endCard.appendChild(eg);
    if (S.found.length) endCard.appendChild(el("p", "found", T("اكتشفت: ") + S.found.map(function (k) { return foundName(lv, k); }).join(T("، ")) + T(". انرقّعت 🩹 وما رح تشتغل مرة تانية.")));
    if (CHAL && CHAL.idx === li) {
      var cmp = S.won ? (S.moves < CHAL.moves ? T(" سبقته! 😎") : S.moves === CHAL.moves ? T(" تعادلتوا.") : T(" هو أسرع منك هالمرة.")) : "";
      endCard.appendChild(el("p", "reveal", T("حيلة صاحبك كانت: «") + (CHAL.trick || "؟") + "»." + cmp));
      CHAL = null;
    }
    if (daily) {
      var dr = dailyResult();
      if (!dr) {
        lsSet("glitchrun_daily_" + DAILY_N, { won: S.won, moves: S.moves, stars: S.won ? S.stars : 0, grid: S.grid.slice(0, 20) });
        ev("daily_done");
        endCard.appendChild(el("p", "miss", T("هاي نتيجتك الرسمية لليوم. بكرا في تحدي جديد.")));
      } else endCard.appendChild(el("p", "miss", T("نتيجتك الرسمية لليوم: ") + (dr.won ? dr.moves + T(" حركة ") + starStr(dr.stars) : T("خسارة")) + T(". هاي جولة تدريب.")));
    }
    renderLevels();
    var row = el("div", "row");
    function btn(cls, text, fn) { var x = el("button", cls, text); x.type = "button"; x.addEventListener("click", fn); row.appendChild(x); return x; }
    if (S.won) {
      btn(found() ? "btn-glitch" : "btn-fill", T("شارك البطاقة"), shareCard);
      btn("btn-wa", T("واتساب"), waShare);
      var lb = btn("btn-line", T("نسخ النتيجة"), function () { copyLink(lb); });
    }
    if (S.won && !daily && li < LEVELS.length - 1) btn("btn-fill", T("المرحلة التالية"), function () { li += 1; newRound(); });
    btn(S.won ? "btn-line" : "btn-fill", S.won ? T("إعادة المرحلة") : T("يلا مرة تانية"), newRound);
    endCard.appendChild(row);
    scrim.hidden = false; endCard.hidden = false;
    cmd.disabled = true; sendBtn.disabled = true;
    var f = row.querySelector("button"); if (f) try { f.focus({ preventScroll: true }); } catch (e) {}
  }
  scrim.addEventListener("click", closeEnd);
  document.addEventListener("keydown", function (e) { if (e.key === "Escape" && !endCard.hidden) closeEnd(); });

  function newRound() {
    closeEnd();
    S = newState(li, S ? S.patched : loadPatched());
    logEl.textContent = ""; lastFilled = 0;
    cmd.disabled = false; sendBtn.disabled = false; hintN = 0;
    runToken = null; runDead = false; S.cmds = []; S.lit = 0; S.grid = [];
    renderLevels(); renderChips(); intro(); updateHUD();
    if (window.matchMedia && window.matchMedia("(pointer: fine)").matches) cmd.focus();
  }

  /* ---------- a turn ---------- */
  async function turn(t) {
    var lv = LEVELS[li], thinking = addThinking();
    var hit = bannedHit(t, banned);
    if (hit) {
      S.moves += 1; finalize(S); S.grid.push("⬛"); thinking.remove();
      await addTurn(t, T("لا لا لا، «") + hit + T("» كلمة ممنوعة اليوم 🤐"), [R("bad", T("راحت عليك حركة."))]);
      beep(SND.bad); afterTurn(); return;
    }
    var actions = null, raw = [], story = "", judged = false;
    var cached = cacheGet(t);
    if (cached && Array.isArray(cached.actions)) {
      raw = cached.actions; actions = sanitizeActions(li, raw, cached.scores); story = String(cached.story || "").slice(0, 320); judged = true; setNarr(T("السارد: محفوظ"));
    } else if (serverOn && !runDead) {
      try {
        var rr = await serverTurn(t);
        if (rr) {
          raw = rr.actions || []; actions = sanitizeActions(li, raw, rr.scores || null); story = String(rr.story || "").slice(0, 320); judged = true;
          setNarr(rr.cached ? T("السارد: محفوظ") : ON);
          cacheSet(t, { actions: raw.slice(0, 12), scores: rr.scores || null, story: story });
        } else setNarr(OFF, true);
      } catch (e) { runDead = true; setNarr(OFF, true); }
    }
    if (!judged) actions = parseMulti(li, t).filter(function (a) { return a !== "none"; });
    if (!actions.length) {
      thinking.remove();
      if (judged && raw.indexOf("none") !== -1) {
        var rn = apply(S, "none"); S.grid.push(GRID[rn.kind] || "🟥"); S.cmds.push({ t: t, g: false });
        await addTurn(t, story || lv.story.none, [rn]); beep(SND.bad); afterTurn(); return;
      }
      await addTurn(t, story || T("العالم ما ركب معو هالحكي. جرّب بطريقة تانية 🙃"), [R("info", T("ما انحسبت حركة."))]);
      afterTurn(); return;
    }
    if (!story || !judged) story = actions.map(function (a) { return lv.story[a] || (lv.novel && lv.novel[a] ? lv.novel[a].name : lv.story.none); }).join(T(" وبعدها "));
    var results = [], before = S.found.length, r2, bad = false;
    for (var i = 0; i < actions.length && !S.over; i++) {
      r2 = lv.novel && lv.novel[actions[i]] ? applyNovel(S, actions[i]) : apply(S, actions[i]);
      results.push(r2); S.grid.push(GRID[r2.kind] || "⬜"); if (r2.kind === "bad") bad = true;
    }
    S.cmds.push({ t: t, g: S.found.length > before });
    thinking.remove();
    await addTurn(t, story, results);
    if (S.found.length === before) beep(bad ? SND.bad : SND.tick);
    afterTurn();
  }

  // No real form submit: sandboxed previews (and some in-app browsers) block it. Button click + Enter instead.
  form.addEventListener("submit", function (e) { e.preventDefault(); });
  sendBtn.addEventListener("click", function (e) { e.preventDefault(); send(); });
  cmd.addEventListener("keydown", function (e) { if (e.key === "Enter" && !e.isComposing) { e.preventDefault(); send(); } });
  async function send() {
    if (busy || S.over) return;
    var t = cmd.value.trim().slice(0, 140); if (!t) return;
    cmd.value = ""; busy = true; sendBtn.disabled = true; touchDay(); beep(SND.tap);
    if (!firstSent) { firstSent = true; ev(Date.now() - loadT < 60000 ? "first_fast" : "first_slow"); }
    try { await turn(t); } catch (err) { if (window.console) console.error(err); } finally { busy = false; if (!S.over) { sendBtn.disabled = false; cmd.focus(); } }
  }
  hintBtn.addEventListener("click", function () {
    if (S.over) return;
    var hints = LEVELS[li].hints, d = el("div", "turn"), box = el("div", "chips-out"); d.appendChild(box);
    if (hintN >= hints.length) box.appendChild(el("span", "chip info", T("خلصت التلميحات. الباقي عليك.")));
    else if (hintN === 0) {
      box.appendChild(el("span", "chip info", T("💡 تلميح ببلاش: ") + hints[0] + T(" (باقي ") + (Object.keys(LEVELS[li].glitches).length - patchedCount(li, S.patched)) + T(" ثغرات مخفية)")));
      hintN = 1; beep(SND.light); ev("hint");
    } else if (LG.n < 1) {
      box.appendChild(el("span", "chip info", T("ما عندك لمبة 💡. كل ثغرة بتلاقيها بتعطيك لمبة.")));
      pulse($("lights")); beep(SND.bad);
    } else {
      LG.n -= 1; lsSet("glitchrun_lights", LG);
      box.appendChild(el("span", "chip info", T("💡 تلميح: ") + hints[hintN]));
      hintN += 1; beep(SND.light); pulse($("lights")); ev("hint");
    }
    logEl.appendChild(d); updateHUD(); toBottom();
  });

  banned.forEach(function (w) { $("bannedList").appendChild(el("span", "w", w)); });
  renderMeters();
  setNarr(serverOn ? ON : OFF, !serverOn);
  if (!applyChallenge()) {
    if (loadBest(LEVELS[0].id) !== null) { daily = true; li = DAILY_IDX; }
    newRound();
  }
  (function () {
    var lv0 = lsGet("glitchrun_lastvisit", 0);
    if (lv0 !== DAY) { ev("visit"); if (lv0 === DAY - 1) ev("return_d1"); lsSet("glitchrun_lastvisit", DAY); }
  })();
}
boot();
</script>

</body></html>
